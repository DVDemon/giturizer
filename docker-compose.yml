name: archdiscovery

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archdiscovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archdiscovery}
      POSTGRES_DB: ${POSTGRES_DB:-archdiscovery}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://archdiscovery:archdiscovery@postgres:5432/archdiscovery}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATA_DIR: ${DATA_DIR:-/data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-insecure-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment: *backend-env
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://archdiscovery:archdiscovery@postgres:5432/archdiscovery}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATA_DIR: ${DATA_DIR:-/data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  data:
