stages:
  - lint
  - test
  - verify

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e "backend[dev]"

lint:
  stage: lint
  script:
    - ruff check backend/src backend/tests
    - black --check backend/src backend/tests
    - mypy --config-file backend/pyproject.toml backend/src

test:
  stage: test
  script:
    - pytest backend/tests -q --cov=archdiscovery --cov-report=term-missing --cov-fail-under=75

web-build:
  stage: test
  image: node:20-alpine
  before_script: []
  script:
    - cd web
    - npm install --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - web/dist

verify-compose:
  stage: verify
  image: docker:27
  before_script: []
  script:
    - docker compose config -q

smoke:
  stage: verify
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  script:
    - docker compose up -d --build
    - sleep 25
    - API_URL=http://localhost:8000 GITLAB_URL="$SMOKE_GITLAB_URL" GITLAB_BRANCH="${SMOKE_GITLAB_BRANCH:-main}" GITLAB_TOKEN="$SMOKE_GITLAB_TOKEN" bash scripts/smoke.sh
  rules:
    - if: $SMOKE_GITLAB_URL
      when: manual
    - when: never
